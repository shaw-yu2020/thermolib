[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "thermolib"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = [
    "feos>=0.9.5",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "scipy>=1.15.3",
    "sympy>=1.14.0",
]

[tool.maturin]
bindings = "pyo3"
features = ["with_pyo3"]

[dependency-groups]
dev = [
    "maturin>=1.14.1",
    "ruff>=0.15.20",
]

